<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a192f">

<!-- PWA メタタグ -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="iKnow!語彙">

<title>ECL & 語彙マスター (iKnow! Style Engine)</title>

<style>
  /* iKnow! App Design System */
  :root {
    --bg-main: #0a192f;
    --panel-bg: rgba(17, 34, 64, 0.95);
    --panel-bg-sub: rgba(10, 25, 47, 0.75);
    --border-color: #233554;
    --text-primary: #e6f1ff;
    --text-muted: #8892b0;
    --cyan: #00f2fe;
    --blue: #4facfe;
    --accent-teal: #31d0aa;
    --emerald: #10b981;
    --rose: #f43f5e;
    --amber: #f59e0b;
    --purple: #a855f7;
    --shadow: 0 14px 35px rgba(0, 0, 0, 0.35);
  }

  [data-theme="light"] {
    --bg-main: #f0f4f8;
    --panel-bg: rgba(255, 255, 255, 0.95);
    --panel-bg-sub: rgba(240, 244, 248, 0.85);
    --border-color: #d0dbe7;
    --text-primary: #0f172a;
    --text-muted: #64748b;
    --shadow: 0 10px 28px rgba(29, 53, 87, 0.1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: radial-gradient(ellipse at top right, #14304a 0%, transparent 50%), var(--bg-main);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding-bottom: 2rem;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  header {
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
    padding: 1.25rem 1rem 0.75rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand-logo {
    width: 46px;
    height: 46px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--cyan), var(--blue));
    display: grid;
    place-items: center;
    font-weight: 900;
    font-size: 1.25rem;
    color: #0a192f;
    box-shadow: 0 10px 20px rgba(0, 242, 254, 0.25);
  }

  .grad-text {
    background: linear-gradient(135deg, var(--cyan), var(--accent-teal));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .grad-btn {
    background: linear-gradient(135deg, var(--cyan), var(--blue));
    color: #0a192f;
    font-weight: 800;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
  }
  .grad-btn:active { transform: scale(0.98); }
  .grad-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  main {
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 1rem;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .glass-card {
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 20px;
    padding: 1.25rem;
    box-shadow: var(--shadow);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.75rem;
  }
  @media (max-width: 640px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
  }

  .stat-card {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .stat-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 700; }
  .stat-val { font-size: 1.5rem; font-weight: 900; margin-top: 0.25rem; }

  .control-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
  }

  select {
    background: var(--panel-bg-sub);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    border-radius: 12px;
    padding: 0.6rem 0.875rem;
    font-size: 0.875rem;
    font-weight: 600;
    outline: none;
  }

  .card-container {
    min-height: 440px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
  }

  .progress-bg {
    width: 100%;
    background: rgba(255,255,255,0.08);
    height: 8px;
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 1rem;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--cyan), var(--accent-teal));
    width: 0%;
    transition: width 0.3s ease;
  }

  .option-btn {
    width: 100%;
    text-align: left;
    padding: 0.875rem 1rem;
    border-radius: 14px;
    border: 1px solid var(--border-color);
    background: var(--panel-bg-sub);
    color: var(--text-primary);
    font-size: 0.95rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 0.5rem;
    cursor: pointer;
    transition: border-color 0.15s, background-color 0.15s;
  }
  .option-btn:hover {
    border-color: var(--cyan);
  }
  .option-btn:active { background: rgba(0, 242, 254, 0.1); }
  .option-badge {
    width: 26px;
    height: 26px;
    border-radius: 8px;
    background: rgba(255,255,255,0.08);
    color: var(--cyan);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 800;
    flex-shrink: 0;
  }

  .ex-box {
    background: var(--panel-bg-sub);
    border: 1px solid rgba(255,255,255,0.05);
    padding: 0.75rem 1rem;
    border-radius: 12px;
    margin-bottom: 0.5rem;
  }

  .syn-ant-box {
    background: rgba(10, 25, 47, 0.85);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 0.75rem 1rem;
    margin-top: 0.5rem;
  }

  .btn-action {
    width: 100%;
    padding: 0.875rem;
    font-size: 0.95rem;
  }

  .toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    background: #0b1329;
    border: 1px solid var(--cyan);
    color: var(--cyan);
    padding: 0.5rem 1.25rem;
    border-radius: 12px;
    font-size: 0.8rem;
    font-weight: 700;
    z-index: 100;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <div style="display:flex; align-items:center; gap:0.75rem;">
    <div class="brand-logo">iK</div>
    <div>
      <div style="font-size:10px; font-weight:800; color:var(--cyan); letter-spacing:1px;">SPACED REPETITION ENGINE</div>
      <h1 style="font-size:1.25rem; font-weight:800;" class="grad-text">ECL & 語彙マスター</h1>
    </div>
  </div>
  <button id="themeToggle" class="glass-card" style="padding:0.5rem 0.75rem; border-radius:12px; font-size:0.875rem; font-weight:700; cursor:pointer;">☼ 切替</button>
</header>

<main>
  <!-- ダッシュボード (統計情報) -->
  <section class="stats-grid">
    <div class="glass-card stat-card">
      <span class="stat-label">学習済み語彙</span>
      <div class="stat-val" style="color:var(--cyan)"><span id="statLearned">0</span> <small style="font-size:0.75rem; color:var(--text-muted)">/ 1154</small></div>
    </div>
    <div class="glass-card stat-card">
      <span class="stat-label">要復習 (Memory Low)</span>
      <div class="stat-val" style="color:var(--rose)"><span id="statReview">0</span> <small style="font-size:0.75rem; color:var(--text-muted)">語</small></div>
    </div>
    <div class="glass-card stat-card">
      <span class="stat-label">定着度スコア</span>
      <div class="stat-val" style="color:var(--emerald)" id="statAccuracy">—</div>
    </div>
    <div class="glass-card stat-card">
      <span class="stat-label">連続正解 Streak</span>
      <div class="stat-val" style="color:var(--amber)"><span id="statStreak">0</span> <small style="font-size:0.75rem; color:var(--text-muted)">問</small></div>
    </div>
  </section>

  <!-- コントロールバー -->
  <section class="glass-card control-bar">
    <div style="display:flex; flex-wrap:wrap; gap:0.5rem;">
      <select id="modeSelect">
        <option value="standard">🎯 標準コース (提示 ➔ 5択 ➔ 実践解説)</option>
        <option value="speed">⚡ スピードコース (即答フラッシュ)</option>
      </select>
      <select id="countSelect">
        <option value="5">5問セット</option>
        <option value="10">10問セット</option>
        <option value="20" selected>20問セット</option>
        <option value="50">50問セット</option>
      </select>
      <select id="rangeSelect">
        <option value="all">全範囲 (1〜1154)</option>
        <option value="part1">Part 1 (1〜591)</option>
        <option value="part2" selected>Part 2 追加語彙 (592〜1154)</option>
      </select>
    </div>
    <button id="startBtn" class="grad-btn btn-action" style="width:auto; padding:0.6rem 1.5rem;">学習スタート ➔</button>
  </section>

  <!-- カードメインエリア -->
  <section class="glass-card card-container">
    <div class="progress-bg"><div id="progressBar" class="progress-fill"></div></div>
    <div id="cardContent" style="flex:1; display:flex; flex-direction:column; justify-content:center;">
      <div style="text-align:center; padding:2rem 0;">
        <div style="font-size:0.75rem; font-weight:800; color:var(--cyan); margin-bottom:0.5rem;">READY TO MASTER</div>
        <h2 style="font-size:1.5rem; font-weight:900;" class="grad-text">ECL & 語彙マスター Web App</h2>
        <p style="font-size:0.875rem; color:var(--text-muted); margin-top:0.75rem; line-height:1.6;">
          全3例文（日本語訳付）＋類義語・対義語の専用例文を完全収録！<br>
          TOEIC Part 5/6/7 & ECLリスニング対策用ひっかけポイント・高頻度パターン完全網羅。
        </p>
      </div>
    </div>
  </section>
</main>

<div style="width:100%; max-width:1000px; margin:0.5rem auto 0; padding:0 1rem; display:flex; justify-content:space-between; font-size:0.75rem; color:var(--text-muted);">
  <button id="ttsBtn" style="background:transparent; border:none; color:var(--text-muted); cursor:pointer;">🔊 音声機能: <span id="ttsState">ON</span></button>
  <button id="resetDataBtn" style="background:transparent; border:none; color:var(--text-muted); cursor:pointer;">学習履歴リセット</button>
</div>

<div id="toast" class="toast hidden"></div>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);

// 各単語の高品質データベース（全3例文+和訳、同義語/反対語の例文+和訳、超実践的テスト解説）

let state = {

  streak: 0,

  correct: 0,
  ttsEnabled: true
};

const STORAGE_KEY = "ecl_vocab_iknow_web_v10";

function loadData() {
  try {
    const d = JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}");
    state.history = d.history || {};
    state.streak = d.streak || 0;
    if(d.theme) document.documentElement.dataset.theme = d.theme;
  } catch(e){}
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      history: state.history,
      streak: state.streak,
      theme: document.documentElement.dataset.theme || "dark"
    }));
  }catch(e){}
}

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.remove("hidden");
  setTimeout(() => t.classList.add("hidden"), 2000);
}

function filterDataByRange(rangeVal) {
  if(rangeVal === "part1") return rawData.filter(x => x.id <= 591);
  if(rangeVal === "part2") return rawData.filter(x => x.id >= 592);
  return rawData;
}

function startSession() {
  const count = Number($("countSelect").value);
  const range = $("rangeSelect").value;
  const targetPool = filterDataByRange(range);
  
  if (targetPool.length === 0) {
    toast("選択された範囲に学習データがありません");
    return;
  }

  const now = Date.now();
  // iKnow! 忘却曲線アルゴリズム (SRS Priority Score)
  let scored = targetPool.map(item => {
    let h = state.history[item.id] || { level: 1, nextReview: 0 };
    let priority = (now - h.nextReview) / (h.level * 1000);
    return { item, priority };
  });
  
  scored.sort((a,b) => b.priority - a.priority);
  state.queue = scored.slice(0, count).map(x => x.item);
  state.pos = 0;
  state.answered = 0;
  state.correct = 0;
  
  renderStep();
}

        </div>

        <button id="showAnsBtn" class="grad-btn btn-action" style="margin-bottom:0.75rem;">意味と解説を表示 (Tap)</button>
        <div id="evalBtns" class="hidden" style="display:grid; grid-template-columns:1fr 1fr; gap:0.75rem;">
          <button id="knowBtn" style="background:rgba(16,185,129,0.2); border:1px solid rgba(16,185,129,0.4); color:var(--emerald); font-weight:800; padding:0.875rem; border-radius:14px; cursor:pointer;">⭕ 覚えていた</button>
          <button id="forgotBtn" style="background:rgba(244,63,94,0.2); border:1px solid rgba(244,63,94,0.4); color:var(--rose); font-weight:800; padding:0.875rem; border-radius:14px; cursor:pointer;">❌ 忘れていた</button>
        </div>
      </div>
    `;

    $("speedAudioBtn").onclick = () => playAudio(item.w);
    $("showAnsBtn").onclick = () => {
      $("ansBox").classList.remove("hidden");
      $("showAnsBtn").classList.add("hidden");
      $("evalBtns").classList.remove("hidden");
    };
    $("knowBtn").onclick = () => handleEval(item, true);
    $("forgotBtn").onclick = () => handleEval(item, false);

  } else {
    // 標準コース (提示フェーズ)
    container.innerHTML = `
      <div style="display:flex; flex-direction:column; gap:0.875rem;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:0.75rem; font-weight:800; padding:0.25rem 0.75rem; background:rgba(79,172,254,0.15); color:var(--blue); border-radius:99px;">ID: ${item.id}</span>
          <button id="cardSoundBtn" style="background:rgba(255,255,255,0.08); border:none; color:var(--cyan); padding:0.25rem 0.75rem; border-radius:8px; cursor:pointer;">🔊 単語を聞く</button>
        </div>

        <div>
          <h2 style="font-size:1.85rem; font-weight:900; color:var(--cyan);">${esc(item.w)}</h2>
          <div style="font-size:1.125rem; font-weight:800; margin:0.25rem 0;">${esc(item.m)}</div>
          <p style="font-size:0.75rem; color:var(--text-muted); background:var(--panel-bg-sub); padding:0.5rem 0.75rem; border-radius:10px; border:1px solid var(--border-color);">${esc(item.u)}</p>
        </div>

        <!-- 全3例文 (和訳付き) -->
        <div>
          <span style="font-size:0.75rem; font-weight:800; color:var(--cyan); letter-spacing:1px;">📝 全3例文 (完全和訳 & 発音対応)</span>
          ${item.exs.map((ex, idx) => `
            <div class="ex-box">
              <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:0.5rem;">
                <p style="font-size:0.825rem; font-weight:600; color:var(--text-primary);"><strong>Ex ${idx+1}:</strong> "${esc(ex.en)}"</p>
                <button class="exAudioBtn" style="background:rgba(255,255,255,0.1); border:none; color:var(--cyan); padding:0.2rem 0.5rem; border-radius:6px; font-size:0.7rem; flex-shrink:0; cursor:pointer;" data-text="${esc(ex.en)}">🔊 再生</button>
              </div>
              <p style="font-size:0.75rem; color:var(--text-muted); margin-top:0.25rem; padding-left:0.75rem; border-left:2px solid var(--cyan);">↳ ${esc(ex.ja)}</p>
            </div>
          `).join("")}
        </div>

        <!-- 同意語・反対語＆専用例文 -->
        <div class="syn-ant-box">
          <div style="margin-bottom:0.5rem;">
            <span style="font-size:0.75rem; font-weight:800; color:var(--cyan);">🔗 同意語:</span>
            <span style="font-size:0.85rem; font-weight:700; margin-left:0.5rem;">${esc(item.s.join(", ")||"なし")}</span>
            ${item.synEx ? `
              <div style="font-size:0.725rem; margin-top:0.25rem; padding-left:0.5rem; color:var(--text-primary);">
                • <em>[Ex: ${esc(item.synEx.word)}]</em> "${esc(item.synEx.en)}"
                <div style="color:var(--text-muted);">↳ ${esc(item.synEx.ja)}</div>
              </div>
            ` : ''}
          </div>

          <div style="border-top:1px dashed var(--border-color); padding-top:0.5rem;">
            <span style="font-size:0.75rem; font-weight:800; color:var(--rose);">⚡ 反対語:</span>
            <span style="font-size:0.85rem; font-weight:700; margin-left:0.5rem;">${esc(item.a.join(", ")||"なし")}</span>
            ${item.antEx ? `
              <div style="font-size:0.725rem; margin-top:0.25rem; padding-left:0.5rem; color:var(--text-primary);">
                • <em>[Ex: ${esc(item.antEx.word)}]</em> "${esc(item.antEx.en)}"
                <div style="color:var(--text-muted);">↳ ${esc(item.antEx.ja)}</div>
              </div>
            ` : ''}
          </div>
        </div>

        <button id="toQuizBtn" class="grad-btn btn-action" style="margin-top:0.5rem;">5択確認クイズへ進む ➔</button>
      </div>
    `;

    $("cardSoundBtn").onclick = () => playAudio(item.w);
    container.querySelectorAll(".exAudioBtn").forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        playAudio(btn.dataset.text);
      };
    });
    $("toQuizBtn").onclick = () => renderQuiz(item);
  }
}

function renderQuiz(item) {
  const container = $("cardContent");
  
  // 誤り選択肢（ディストラクター）を実在の意味プールから抽出
  let distractors = validMeaningPool.filter(m => m !== item.m);
  distractors.sort(() => Math.random() - 0.5);
  
  let options = distractors.slice(0, 4);
  options.push(item.m);
  options.sort(() => Math.random() - 0.5);

  container.innerHTML = `
    <div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.75rem;">
        <span style="font-size:0.75rem; font-weight:800; color:var(--amber);">❓ 5択確認クイズ</span>
        <span style="font-size:0.75rem; color:var(--text-muted);">ID: ${item.id}</span>
      </div>
      <h3 style="font-size:1.75rem; font-weight:900; color:var(--cyan); text-align:center; margin-bottom:1rem;">${esc(item.w)}</h3>
      
      <p style="font-size:0.75rem; color:var(--text-muted); text-align:center; margin-bottom:1rem;">最も適した日本語の意味を選んでください。</p>

      <div style="margin-bottom:1.25rem;">
        ${options.map((opt, idx) => `
          <button class="option-btn optBtn" data-val="${esc(opt)}">
            <span class="option-badge">${"ABCDE"[idx]}</span>
            <span>${esc(opt)}</span>
          </button>
        `).join("")}
      </div>
    </div>
  `;

  container.querySelectorAll(".optBtn").forEach(btn => {
    btn.onclick = () => {
      const selected = btn.dataset.val;
      const isOk = (selected === item.m);
      handleQuizResult(item, isOk);
    };
  });
}

function handleQuizResult(item, isOk) {
  state.answered++;
  if(isOk) {
    state.correct++;
    state.streak++;
  } else {
    state.streak = 0;
  }
  updateMemoryLevel(item.id, isOk);

  const container = $("cardContent");
  container.innerHTML = `
    <div style="display:flex; flex-direction:column; gap:0.875rem;">
      <div style="padding:0.875rem; border-radius:14px; background:${isOk ? 'rgba(16,185,129,0.15)' : 'rgba(244,63,94,0.15)'}; border:1px solid ${isOk ? 'rgba(16,185,129,0.3)' : 'rgba(244,63,94,0.3)'}; display:flex; align-items:center; gap:0.75rem;">
        <span style="font-size:1.75rem;">${isOk ? '🎉' : '❌'}</span>
        <div>
          <h4 style="font-size:1rem; font-weight:800; color:${isOk ? 'var(--emerald)' : 'var(--rose)'};">${isOk ? '正解！ Perfect' : '不正解...'}</h4>
          <p style="font-size:0.75rem; color:var(--text-muted);">${esc(item.w)} : <strong>${esc(item.m)}</strong></p>
        </div>
      </div>

      <!-- 実践的ワンポイント試験アドバイス -->
      <div style="font-size:0.75rem; background:var(--panel-bg-sub); padding:0.875rem; border-radius:12px; border:1px solid rgba(0,242,254,0.3); color:var(--text-primary); line-height:1.5;">
        <div style="font-weight:800; color:var(--cyan); margin-bottom:0.35rem; display:flex; align-items:center; gap:0.25rem;">
          💡 <strong>TOEIC / ECL / 英検 実践出題アドバイス</strong>
        </div>
        <div style="white-space:pre-wrap;">${esc(item.e)}</div>
      </div>

      <!-- 文法構造 & 構文解説 -->
      <div style="font-size:0.75rem; background:var(--panel-bg-sub); padding:0.875rem; border-radius:12px; border:1px solid rgba(79,172,254,0.3); color:var(--text-primary); line-height:1.5;">
        <div style="font-weight:800; color:var(--blue); margin-bottom:0.35rem;">
          📐 <strong>文法ポイント & コロケーション構造</strong>
        </div>
        <div>${esc(item.g)}</div>
      </div>

      <button id="nextBtn" class="grad-btn btn-action">次の問題へ ➔</button>
    </div>
  `;

  $("nextBtn").onclick = () => {
    state.pos++;
    renderStep();
  };
  updateDashboard();
  saveData();
}

function handleEval(item, remembered) {
  state.answered++;
  if(remembered) {
    state.correct++;
    state.streak++;
  } else {
    state.streak = 0;
  }
  updateMemoryLevel(item.id, remembered);
  state.pos++;
  renderStep();
  updateDashboard();
  saveData();
}

function updateMemoryLevel(id, ok) {
  let h = state.history[id] || { level: 1, nextReview: 0 };
  if(ok) {
    h.level = Math.min(5, h.level + 1);
    h.nextReview = Date.now() + (Math.pow(2, h.level) * 3600 * 1000);
  } else {
    h.level = 1;
    h.nextReview = Date.now();
  }
  state.history[id] = h;
}

function showResult() {
  $("progressBar").style.width = "100%";
  const pct = state.answered ? Math.round((state.correct / state.answered) * 100) : 0;
  const container = $("cardContent");

  container.innerHTML = `
    <div style="text-align:center; padding:1.5rem 0; display:flex; flex-direction:column; gap:1rem; align-items:center;">
      <div style="font-size:0.75rem; font-weight:800; color:var(--cyan);">SESSION COMPLETE</div>
      <h2 style="font-size:1.75rem; font-weight:900;" class="grad-text">お疲れさまでした！</h2>
      
      <div style="width:90px; height:90px; border-radius:50%; border:4px solid var(--cyan); display:flex; align-items:center; justify-content:center; background:var(--panel-bg-sub);">
        <span style="font-size:1.5rem; font-weight:900; color:var(--cyan);">${pct}%</span>
      </div>

      <p style="font-size:0.875rem; color:var(--text-muted);">
        回答数: ${state.answered} 問 | 正解数: ${state.correct} 問
      </p>

      <button id="restartBtn" class="grad-btn btn-action" style="width:auto; padding:0.75rem 2rem;">次のセッションを開始 ➔</button>
    </div>
  `;
  $("restartBtn").onclick = startSession;
  updateDashboard();
  saveData();
}

function updateDashboard() {
  const vals = Object.values(state.history);
  const learned = vals.filter(x => x.level >= 3).length;
  const review = vals.filter(x => x.level <= 2).length;
  
  $("statLearned").textContent = learned;
  $("statReview").textContent = review;
  $("statStreak").textContent = state.streak;

  if(state.answered > 0) {
    const acc = Math.round((state.correct / state.answered) * 100);
    $("statAccuracy").textContent = acc + "%";
  } else {
    $("statAccuracy").textContent = "—";
  }
}

function playAudio(text) {
  if(!state.ttsEnabled || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.95;
  speechSynthesis.speak(u);
}

function esc(str) {
  return String(str??"").replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function init() {
  loadData();
  
  $("startBtn").onclick = startSession;
  
  $("themeToggle").onclick = () => {
    const current = document.documentElement.dataset.theme;
    const next = current === "light" ? "dark" : "light";
    document.documentElement.dataset.theme = next;
    saveData();
  };

  $("ttsBtn").onclick = () => {
    state.ttsEnabled = !state.ttsEnabled;
    $("ttsState").textContent = state.ttsEnabled ? "ON" : "OFF";
    toast(state.ttsEnabled ? "音声ON" : "音声OFF");
  };

  $("resetDataBtn").onclick = () => {
    if(confirm("全ての学習履歴データを初期化しますか？")) {
      localStorage.removeItem(STORAGE_KEY);
      state.history = {};
      state.streak = 0;
      updateDashboard();
      toast("初期化しました");
    }
  };

  updateDashboard();
}

init();
})();
</script>
</body>
</html>
